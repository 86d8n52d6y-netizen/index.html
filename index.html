<title>PROGRES</title>
<style>
:root{
  --bg:#16171B; --surface:#1E2024; --surface-hi:#262930; --surface-hi2:#2E323A;
  --border:#34373E; --text:#F4F2EC; --text-muted:#9C9DA4; --text-faint:#6C6E76;
  --accent:#E8BB3E; --accent-ink:#1A1B1E; --pr:#DE5B4B;
  --t1:#6C9BC9; --t2:#E8BB3E; --t3:#DE5B4B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
body{padding-bottom:env(safe-area-inset-bottom);}
#app{min-height:100vh; display:flex; flex-direction:column;}
button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit; -webkit-appearance:none;}
input{font-family:inherit; color:var(--text);}
input::placeholder{color:var(--text-faint);}
input:focus{outline:2px solid var(--accent); outline-offset:1px;}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
input[type=number]{-moz-appearance:textfield;}
::-webkit-scrollbar{display:none;}
.wordmark{font-weight:800; letter-spacing:0.05em;}
.num{font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:0.01em;}
.hcap{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; font-weight:700; color:var(--text-faint);}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.anim{animation:fadeUp .22s ease-out;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{animation:spin .8s linear infinite;}
</style>
</head>

// ---------- storage ----------
const K_PLANS = 'progres_plans_v1';
const K_SESSIONS = 'progres_sessions_v1';
const K_META = 'progres_meta_v1';

function storageAvailable(){
  try { const k='__t__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
function loadAll(){
  const ok = storageAvailable();
  if(!ok) return { plans: SEED_PLANS, sessions: SEED_SESSIONS, meta: {tipDismissed:false}, storageOk:false };
  try {
    const plansRaw = localStorage.getItem(K_PLANS);
    const sessionsRaw = localStorage.getItem(K_SESSIONS);
    if(!plansRaw || !sessionsRaw){
      localStorage.setItem(K_PLANS, JSON.stringify(SEED_PLANS));
      localStorage.setItem(K_SESSIONS, JSON.stringify(SEED_SESSIONS));
      localStorage.setItem(K_META, JSON.stringify({tipDismissed:false}));
      return { plans: SEED_PLANS, sessions: SEED_SESSIONS, meta:{tipDismissed:false}, storageOk:true };
    }
    let meta = {};
    try { meta = JSON.parse(localStorage.getItem(K_META) || '{}'); } catch(e){ meta = {}; }
    return { plans: JSON.parse(plansRaw), sessions: JSON.parse(sessionsRaw), meta, storageOk:true };
  } catch(e){
    return { plans: SEED_PLANS, sessions: SEED_SESSIONS, meta:{}, storageOk:false };
  }
}
function savePlans(p){ try{ localStorage.setItem(K_PLANS, JSON.stringify(p)); }catch(e){} }
function saveSessions(s){ try{ localStorage.setItem(K_SESSIONS, JSON.stringify(s)); }catch(e){} }
function saveMeta(m){ try{ localStorage.setItem(K_META, JSON.stringify(m)); }catch(e){} }

// ---------- helpers ----------
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); const off=d.getTimezoneOffset(); return new Date(d.getTime()-off*60000).toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDatePL(dateStr, opts){
  opts = opts || {};
  const d = new Date(dateStr+'T00:00:00');
  const o = {day:'numeric', month:'short'};
  if(opts.weekday) o.weekday='short';
  if(opts.year) o.year='numeric';
  return d.toLocaleDateString('pl-PL', o);
}
function daysSinceLabel(dateStr){
  if(!dateStr) return 'Nigdy';
  const d = new Date(dateStr+'T00:00:00');
  const today = new Date(todayStr()+'T00:00:00');
  const diff = Math.round((today-d)/86400000);
  if(diff===0) return 'Dziś';
  if(diff===1) return 'Wczoraj';
  if(diff<0) return formatDatePL(dateStr);
  return diff+' dni temu';
}
function parseTargetSets(target){ if(!target) return 3; const m=String(target).match(/(\d+)\s*x/i); return m?parseInt(m[1],10):3; }
function lastSessionFor(sessions, wk){ const l=sessions.filter(s=>s.workout===wk).sort((a,b)=>b.date.localeCompare(a.date)); return l[0]||null; }
function historyForExercise(sessions, code){
  const list=[];
  sessions.forEach(s=>s.entries.forEach(e=>{ if(e.code===code) list.push({date:s.date, ...e}); }));
  list.sort((a,b)=>a.date.localeCompare(b.date));
  return list;
}
function lastEntryForExercise(sessions, code){ const h=historyForExercise(sessions,code); return h.length?h[h.length-1]:null; }
function prForExercise(sessions, code){ const h=historyForExercise(sessions,code); if(!h.length) return null; return h.reduce((b,c)=>c.weight>b.weight?c:b, h[0]); }
function flatExercisesWithHistory(plans, sessions){
  const out=[]; const seen=new Set();
  WORKOUT_ORDER.forEach(wk=>{ plans[wk].exercises.forEach(ex=>{ out.push({...ex, workout:wk}); seen.add(ex.code); }); });
  sessions.forEach(s=>s.entries.forEach(e=>{ if(!seen.has(e.code)){ seen.add(e.code); out.push({code:e.code, name:e.name, target:null, workout:s.workout}); } }));
  return out;
}
function fmtWeight(w){ if(w===null||w===undefined||w==='') return '-'; return String(Number(w)); }
function fmtReps(reps){ return reps && reps.length ? reps.join('/') : '-'; }

// ---------- SVG line chart ----------
function renderChart(data, w, h){
  if(data.length < 2) return '<div style="padding:28px 12px; text-align:center; font-size:13px; color:var(--text-faint);">Za mało danych na wykres — zaloguj kolejny trening</div>';
  const weights = data.map(d=>d.weight);
  const minW = Math.min.apply(null, weights), maxW = Math.max.apply(null, weights);
  const pad = (maxW-minW)*0.2 || 5;
  const yMin = minW-pad, yMax = maxW+pad;
  const P = {top:14, right:14, bottom:22, left:8};
  const cw = w-P.left-P.right, ch = h-P.top-P.bottom;
  const pts = data.map((d,i)=>{
    const x = P.left + (data.length===1?0:(i/(data.length-1))*cw);
    const y = P.top + (1-(d.weight-yMin)/(yMax-yMin))*ch;
    return {x:x,y:y,date:d.date,weight:d.weight};
  });
  const pathD = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const circles = pts.map(p=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" style="fill:var(--accent)"/>').join('');
  const gridY = [0,0.5,1].map(f=>P.top+f*ch);
  const grid = gridY.map(y=>'<line x1="'+P.left+'" y1="'+y.toFixed(1)+'" x2="'+(w-P.right)+'" y2="'+y.toFixed(1)+'" style="stroke:var(--border)" stroke-dasharray="3 3"/>').join('');
  const step = Math.max(1, Math.ceil(pts.length/4));
  let labels = '';
  pts.forEach((p,i)=>{
    if(i===0 || i===pts.length-1 || i%step===0){
      labels += '<text x="'+p.x.toFixed(1)+'" y="'+(h-6)+'" font-size="10" text-anchor="middle" style="fill:var(--text-faint)">'+esc(formatDatePL(p.date))+'</text>';
    }
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'+grid+'<path d="'+pathD+'" fill="none" style="stroke:var(--accent)" stroke-width="2.5"/>'+circles+labels+'</svg>';
}

function sessionCard(session, open, showDelete){
  const wColor = WCOLOR[session.workout];
  const wLabel = (S.plans[session.workout]&&S.plans[session.workout].label)||session.workout;
  const isOpen = open || S.openSessionId===session.id;
  let html = '<div style="background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:10px;">';
  html += '<button data-action="toggle-session" data-id="'+session.id+'" style="width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px;">';
  html += '<div style="display:flex; align-items:center; gap:12px;">';
  html += '<div style="width:6px; height:40px; border-radius:3px; background:'+wColor+';"></div>';
  html += '<div style="text-align:left;"><div style="font-weight:800; font-size:14px;">'+esc(wLabel)+'</div>';
  html += '<div style="font-size:12px; color:var(--text-muted);">'+esc(formatDatePL(session.date,{weekday:true,year:true}))+'</div></div></div>';
  html += '<div style="display:flex; align-items:center; gap:8px; color:var(--text-faint);">';
  html += '<span style="font-size:12px;">'+session.entries.length+' ćw.</span>';
  html += '<span style="display:flex;">'+icon(isOpen?'chevUp':'chevDown',18)+'</span></div></button>';
  if(isOpen){
    html += '<div style="padding:0 14px 14px; border-top:1px solid var(--border);">';
    session.entries.forEach(e=>{
      html += '<div style="display:flex; align-items:center; justify-content:space-between; padding-top:10px; font-size:14px; gap:10px;">';
      html += '<span style="color:var(--text-muted);">'+esc(e.name)+'</span>';
      html += '<span class="num" style="white-space:nowrap;">'+fmtWeight(e.weight)+' kg · '+fmtReps(e.reps)+'</span></div>';
    });
    if(showDelete){
      html += '<button data-action="confirm-delete-session" data-id="'+session.id+'" style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--pr); padding-top:12px;">'+icon('trash',14)+' Usuń trening</button>';
    }
    html += '</div>';
  }
  html += '</div>';
  if(showDelete && S.confirmDeleteId===session.id){
    html += '<div style="display:flex; align-items:center; justify-content:space-between; margin:-4px 0 10px 6px;">';
    html += '<span style="font-size:12px; color:var(--text-muted);">Usunąć ten trening?</span>';
    html += '<div style="display:flex; gap:14px;">';
    html += '<button data-action="cancel-delete-session" style="font-size:12px; font-weight:700; color:var(--text-muted);">Anuluj</button>';
    html += '<button data-action="delete-session" data-id="'+session.id+'" style="font-size:12px; font-weight:700; color:var(--pr);">Usuń</button>';
    html += '</div></div>';
  }
  return html;
}

  if(!S.progressCode || !flat.find(f=>f.code===S.progressCode)) S.progressCode = flat[0]?flat[0].code:null;
  const hist = S.progressCode ? historyForExercise(S.sessions, S.progressCode) : [];
  const pr = hist.length ? hist.reduce((b,c)=>c.weight>b.weight?c:b, hist[0]) : null;

  let html = '<div class="anim" style="padding-top:4px; padding-bottom:16px;">';

// ---------- log form helpers ----------
function initLogForm(wk){
  const exercises = S.plans[wk].exercises;
  const entries = {};
  exercises.forEach(ex=>{
    const last = lastEntryForExercise(S.sessions, ex.code);
    const setCount = last ? last.reps.length : parseTargetSets(ex.target);
    entries[ex.code] = { name: ex.name, weight: last?String(last.weight):'', reps: last?last.reps.map(String):Array(setCount).fill(''), custom:false };
  });
  S.logKey = wk;
  S.form = { date: todayStr(), entries: entries };
  S.logSaved = null;
}
function syncLogFormFromDOM(){
  if(!S.logKey || !S.form.entries) return;
  const dateInput = document.getElementById('log-date-input');
  if(dateInput) S.form.date = dateInput.value;
  document.querySelectorAll('[data-code]').forEach(function(block){
    const code = block.getAttribute('data-code');
    const entry = S.form.entries[code];
    if(!entry) return;
    const weightInput = block.querySelector('[data-role="weight"]');
    if(weightInput) entry.weight = weightInput.value;
    const nameInput = block.querySelector('[data-role="custom-name"]');
    if(nameInput) entry.name = nameInput.value;
    const repInputs = block.querySelectorAll('[data-role="rep"]');
    if(repInputs.length){ const reps=[]; repInputs.forEach(function(ri){reps.push(ri.value);}); entry.reps = reps; }
  });
}
function syncSettingsFromDOM(){
  if(!S.settingsDraft) return;
  WORKOUT_ORDER.forEach(function(wk){
    const labelInput = document.querySelector('[data-role="wk-label"][data-wk="'+wk+'"]');
    if(labelInput) S.settingsDraft[wk].label = labelInput.value;
    S.settingsDraft[wk].exercises.forEach(function(ex, idx){
      const nameInput = document.querySelector('[data-role="ex-name"][data-wk="'+wk+'"][data-idx="'+idx+'"]');
      const targetInput = document.querySelector('[data-role="ex-target"][data-wk="'+wk+'"][data-idx="'+idx+'"]');
      if(nameInput) ex.name = nameInput.value;
      if(targetInput) ex.target = targetInput.value;
    });
  });
}
function doSaveSession(){
  const entries = [];
  const newCustomDefs = [];
  Object.keys(S.form.entries).forEach(function(code){
    const d = S.form.entries[code];
    if(d.weight==='' || d.weight===null || d.weight===undefined) return;
    if(d.custom && !d.name.trim()) return;
    const name = d.custom ? d.name.trim() : d.name;
    entries.push({ code:code, name:name, weight:parseFloat(d.weight), reps:d.reps.map(function(r){return r===''?0:parseInt(r,10);}), info:null });
    if(d.custom) newCustomDefs.push({code:code, name:name, target:null});
  });
  if(!entries.length){ alert('Wpisz przynajmniej jeden ciężar, żeby zapisać trening.'); return; }
  const prNames = entries.filter(function(e){
    const prev = prForExercise(S.sessions, e.code);
    return (prev && e.weight>prev.weight) || (!prev && e.weight>0);
  }).map(function(e){return e.name;});
  if(newCustomDefs.length){
    S.plans[S.logKey].exercises = S.plans[S.logKey].exercises.concat(newCustomDefs);
    savePlans(S.plans);
  }
  const session = {id:genId(), date:S.form.date, workout:S.logKey, entries:entries};
  S.sessions.push(session);
  saveSessions(S.sessions);
  S.logSaved = {count:entries.length, prs:prNames};
}
function doSaveSettings(){
  const cleaned = {};
  WORKOUT_ORDER.forEach(function(wk){
    const label = (S.settingsDraft[wk].label||'').trim() || S.plans[wk].label;
    const exercises = S.settingsDraft[wk].exercises
      .map(function(ex){ return {code:ex.code, name:(ex.name||'').trim(), target: ex.target && ex.target.trim() ? ex.target.trim() : null}; })
      .filter(function(ex){ return ex.name; });
    cleaned[wk] = {label:label, exercises:exercises};
  });
  S.plans = cleaned;
  savePlans(S.plans);
  S.showSettings = false;
}
function doExport(){
  const data = {plans:S.plans, sessions:S.sessions, exportedAt:new Date().toISOString(), app:'PROGRES'};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'progres-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);}, 1000);
}

// ---------- render ----------
function render(){
  let html = viewHeader();
  html += '<main style="flex:1; overflow-y:auto; padding:0 16px 96px;">';
  if(S.showSettings){ html += viewSettings(); }
  else if(S.tab==='home'){ html += viewHome(); }
  else if(S.tab==='log'){ html += viewLog(); }
  else if(S.tab==='progress'){ html += viewProgress(); }
  else if(S.tab==='history'){ html += viewHistory(); }
  html += '</main>';
  html += viewTabBar();
  document.getElementById('app').innerHTML = html;
}

// ---------- action dispatcher ----------
function handleAction(action, ds, code){
  switch(action){
    case 'set-tab':
      S.showSettings = false;
      if(ds.tab==='log'){ S.logKey=null; S.form={}; S.logSaved=null; }
      S.tab = ds.tab;
      break;
    case 'go-log':
      S.showSettings = false; S.tab = 'log';
      if(ds.workout) initLogForm(ds.workout); else { S.logKey=null; S.form={}; S.logSaved=null; }
      break;
    case 'select-workout': initLogForm(ds.workout); break;
    case 'change-workout': S.logKey=null; S.form={}; S.logSaved=null; break;
    case 'add-set': syncLogFormFromDOM(); if(code && S.form.entries[code]) S.form.entries[code].reps.push(''); break;
    case 'remove-set': syncLogFormFromDOM(); if(code && S.form.entries[code] && S.form.entries[code].reps.length>1) S.form.entries[code].reps.pop(); break;
    case 'add-custom-exercise':
      syncLogFormFromDOM();
      S.form.entries[S.logKey+'_custom_'+genId()] = {name:'', weight:'', reps:['','',''], custom:true};
      break;
    case 'remove-custom': syncLogFormFromDOM(); if(code) delete S.form.entries[code]; break;
    case 'save-session': syncLogFormFromDOM(); doSaveSession(); break;
    case 'close-log-success': S.logKey=null; S.form={}; S.logSaved=null; break;
    case 'toggle-session': S.openSessionId = (S.openSessionId===ds.id)?null:ds.id; break;
    case 'confirm-delete-session': S.confirmDeleteId = ds.id; break;
    case 'cancel-delete-session': S.confirmDeleteId = null; break;
    case 'delete-session': S.sessions = S.sessions.filter(function(s){return s.id!==ds.id;}); saveSessions(S.sessions); S.confirmDeleteId=null; break;
    case 'select-progress': S.progressCode = ds.code; break;
    case 'open-settings': S.settingsDraft = JSON.parse(JSON.stringify(S.plans)); S.showSettings = true; break;
    case 'close-settings': S.showSettings = false; break;
    case 'add-ex': syncSettingsFromDOM(); S.settingsDraft[ds.wk].exercises.push({code:ds.wk+'_new_'+genId(), name:'', target:''}); break;
    case 'remove-ex': syncSettingsFromDOM(); S.settingsDraft[ds.wk].exercises.splice(parseInt(ds.idx,10),1); break;
    case 'save-settings': syncSettingsFromDOM(); doSaveSettings(); break;
    case 'export-data': doExport(); return;
    case 'trigger-import': document.getElementById('import-file-input').click(); return;
    case 'dismiss-tip': S.showTip=false; S.meta.tipDismissed=true; saveMeta(S.meta); break;
    default: return;
  }
  render();
}

// ---------- init ----------
var S = Object.assign({tab:'home', logKey:null, form:{}, logSaved:null, showSettings:false, settingsDraft:null, confirmDeleteId:null, openSessionId:null, progressCode:null}, loadAll());
S.showTip = !(S.meta && S.meta.tipDismissed);

document.getElementById('app').addEventListener('click', function(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const codeBlock = btn.closest('[data-code]');
  const code = codeBlock ? codeBlock.getAttribute('data-code') : (btn.dataset.code||null);
  handleAction(action, btn.dataset, code);
});

document.getElementById('import-file-input').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = JSON.parse(ev.target.result);
      if(data.plans && data.sessions){
        S.plans = data.plans; S.sessions = data.sessions;
        savePlans(S.plans); saveSessions(S.sessions);
        render();
        alert('Dane zaimportowane pomyślnie.');
      } else { alert('Nieprawidłowy format pliku.'); }
    }catch(err){ alert('Błąd podczas importu: '+err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

render();
</script>
</body>
</html>
