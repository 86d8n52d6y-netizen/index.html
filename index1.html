<style>
:root{
  --bg:#0F0B1A; --surface:#1A1428; --surface-hi:#241C36; --surface-hi2:#2C2242;
  --border:#35294D; --text:#F5F0FF; --text-muted:#B5A5D6; --text-faint:#6F5D8F;
  --accent:#A855F7; --accent2:#22D3EE; --accent-ink:#0F0B1A;
  --pr:#FF3D71; --green:#2DD4A7;
  --t1:#22D3EE; --t2:#A855F7; --t3:#FF3D71;
  --grad: linear-gradient(135deg, var(--accent), var(--accent2));
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
body{padding-bottom:env(safe-area-inset-bottom);
  background-image:
    radial-gradient(ellipse 600px 300px at 15% -5%, rgba(168,85,247,0.20), transparent),
    radial-gradient(ellipse 500px 300px at 100% 10%, rgba(34,211,238,0.14), transparent);
  background-attachment:fixed;}
#app{min-height:100vh; display:flex; flex-direction:column;}
button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit; -webkit-appearance:none;}
input,select,textarea{font-family:inherit; color:var(--text);}
input::placeholder{color:var(--text-faint);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent2); outline-offset:1px;}
button:focus-visible{outline:2px solid var(--accent2); outline-offset:2px;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
input[type=number]{-moz-appearance:textfield;}
::-webkit-scrollbar{display:none;}
.wordmark{font-weight:800; letter-spacing:0.04em; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
.num{font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:0.01em;}
.hcap{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; font-weight:700; color:var(--text-faint);}
.card{background:var(--surface); border:1px solid var(--border); border-radius:16px;}
.glow{box-shadow:0 0 0 1px rgba(168,85,247,0.35), 0 4px 24px rgba(168,85,247,0.25);}
.grad-btn{background:var(--grad); color:#0F0B1A; font-weight:800; letter-spacing:0.02em; border-radius:16px; box-shadow:0 6px 20px rgba(168,85,247,0.35);}
.grad-text{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.anim{animation:fadeUp .25s cubic-bezier(.2,.8,.2,1);}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{animation:spin .8s linear infinite;}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(168,85,247,0.5);} 50%{box-shadow:0 0 0 8px rgba(168,85,247,0);}}
.pulse{animation:pulseGlow 1.8s ease-out infinite;}
@keyframes popIn{0%{transform:scale(0.5); opacity:0;} 60%{transform:scale(1.08);} 100%{transform:scale(1); opacity:1;}}
.pop{animation:popIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes countUpFade{from{opacity:0.3;} to{opacity:1;}}
@keyframes confettiFall{
  0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:1;}
  100%{transform:translateY(220px) translateX(var(--dx)) rotate(var(--rot)); opacity:0;}
}
.confetti-piece{position:absolute; top:0; left:50%; width:7px; height:7px; border-radius:2px; animation:confettiFall 1.1s ease-in forwards;}
.trend-up{color:var(--green);}
.trend-down{color:var(--pr);}
.trend-flat{color:var(--text-faint);}
</style>
</head>

// ---------- basic helpers ----------
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); const off=d.getTimezoneOffset(); return new Date(d.getTime()-off*60000).toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDatePL(dateStr, opts){
  opts = opts || {};
  const d = new Date(dateStr+'T00:00:00');
  const o = {day:'numeric', month:'short'};
  if(opts.weekday) o.weekday='short';
  if(opts.year) o.year='numeric';
  return d.toLocaleDateString('pl-PL', o);
}
function daysSinceLabel(dateStr){
  if(!dateStr) return 'Nigdy';
  const d = new Date(dateStr+'T00:00:00');
  const today = new Date(todayStr()+'T00:00:00');
  const diff = Math.round((today-d)/86400000);
  if(diff===0) return 'Dziś';
  if(diff===1) return 'Wczoraj';
  if(diff<0) return formatDatePL(dateStr);
  return diff+' dni temu';
}
function parseTargetSets(target){ if(!target) return 3; const m=String(target).match(/(\d+)\s*x/i); return m?parseInt(m[1],10):3; }
function parseTargetRepsMax(target){
  if(!target) return null;
  const m = String(target).match(/(\d+)\s*-\s*(\d+)\s*$/);
  if(m) return parseInt(m[2],10);
  const m2 = String(target).match(/(\d+)\s*$/);
  return m2 ? parseInt(m2[1],10) : null;
}
function lastSessionFor(sessions, wk){ const l=sessions.filter(s=>s.workout===wk).sort((a,b)=>b.date.localeCompare(a.date)); return l[0]||null; }
function historyForExercise(sessions, code){
  const list=[];
  sessions.forEach(s=>s.entries.forEach(e=>{ if(e.code===code) list.push({date:s.date, sessionId:s.id, ...e}); }));
  list.sort((a,b)=>a.date.localeCompare(b.date));
  return list;
}
function lastEntryForExercise(sessions, code){ const h=historyForExercise(sessions,code); return h.length?h[h.length-1]:null; }
function prForExercise(sessions, code){ const h=historyForExercise(sessions,code); if(!h.length) return null; return h.reduce((b,c)=>c.weight>b.weight?c:b, h[0]); }
function flatExercisesWithHistory(plans, sessions){
  const out=[]; const seen=new Set();
  WORKOUT_ORDER.forEach(wk=>{ plans[wk].exercises.forEach(ex=>{ out.push({...ex, workout:wk}); seen.add(ex.code); }); });
  sessions.forEach(s=>s.entries.forEach(e=>{ if(!seen.has(e.code)){ seen.add(e.code); out.push({code:e.code, name:e.name, target:null, muscleGroup:'', workout:s.workout}); } }));
  return out;
}
function fmtWeight(w){ if(w===null||w===undefined||w==='') return '-'; return String(Number(w)); }
function fmtReps(reps){ return reps && reps.length ? reps.join('/') : '-'; }
function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }

// ---------- training-science calculations ----------
function epley1RM(weight, reps){ if(!reps || reps<=0) return weight; return reps===1 ? weight : weight*(1+reps/30); }
function entryBest1RM(entry){
  if(!entry.reps || !entry.reps.length) return epley1RM(entry.weight,1);
  const maxReps = Math.max.apply(null, entry.reps);
  return epley1RM(entry.weight, maxReps);
}
function entryVolume(entry){ return entry.weight * (entry.reps||[]).reduce((a,b)=>a+b,0); }
function sessionVolume(session){ return session.entries.reduce((sum,e)=>sum+entryVolume(e),0); }

function computeTrend(sessions, code){
  const hist = historyForExercise(sessions, code);
  if(hist.length < 2) return {state:'flat', reason:'Za mało danych, żeby ocenić trend — zapisz kolejne treningi.', hasData:false};
  const window = hist.slice(-5);
  const first = window[0], last = window[window.length-1];
  const first1RM = entryBest1RM(first), last1RM = entryBest1RM(last);
  const diff = last1RM - first1RM;
  const pct = first1RM ? (diff/first1RM*100) : 0;
  let state = 'flat';
  if(pct > 2.5) state = 'up'; else if(pct < -2.5) state = 'down';
  const verb = diff>=0 ? 'wzrósł' : 'spadł';
  const reason = (state==='flat')
    ? 'Szacowany 1RM utrzymuje się blisko '+fmt1(last1RM)+' kg w ciągu ostatnich '+window.length+' treningów — brak istotnej zmiany.'
    : 'Szacowany 1RM '+verb+' z '+fmt1(first1RM)+' kg do '+fmt1(last1RM)+' kg w ciągu ostatnich '+window.length+' treningów.';
  return {state:state, reason:reason, diff:diff, pct:pct, first1RM:first1RM, last1RM:last1RM, hasData:true};
}

function suggestNextWeight(sessions, ex){
  const last = lastEntryForExercise(sessions, ex.code);
  if(!last) return null;
  const capMax = parseTargetRepsMax(ex.target);
  if(capMax && last.reps.length && last.reps.every(r=>r>=capMax)){
    return {weight: Math.round((last.weight+2.5)*2)/2, reason:'Wszystkie serie osiągnęły górny zakres ('+capMax+') — czas dodać ciężar.'};
  }
  return {weight: last.weight, reason:'Zostań przy tym samym ciężarze, aż domkniesz górny zakres powtórzeń.'};
}

function compareToLast(sessions, code, currentWeight, currentReps){
  const last = lastEntryForExercise(sessions, code);
  if(!last || currentWeight==null || currentWeight==='') return null;
  const wDiff = Number(currentWeight) - last.weight;
  const rDiff = (currentReps||[]).reduce((a,b)=>a+(parseInt(b,10)||0),0) - (last.reps||[]).reduce((a,b)=>a+b,0);
  return {weightDiff:wDiff, repsDiff:rDiff};
}

// ---------- streak / weekly stats ----------
function isoWeekKey(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = (d.getDay()+6)%7; // Mon=0
  const monday = new Date(d); monday.setDate(d.getDate()-day);
  return monday.toISOString().slice(0,10);
}
function computeStreak(sessions){
  if(!sessions.length) return 0;
  const weeks = new Set(sessions.map(s=>isoWeekKey(s.date)));
  let streak = 0;
  let cursor = new Date(isoWeekKey(todayStr())+'T00:00:00');
  while(weeks.has(cursor.toISOString().slice(0,10))){
    streak++;
    cursor.setDate(cursor.getDate()-7);
  }
  return streak;
}
function sessionsInRange(sessions, fromDate, toDate){
  return sessions.filter(s=>s.date>=fromDate && s.date<=toDate);
}
function weeklyGoalProgress(sessions, targetPerWeek){
  const mondayStr = isoWeekKey(todayStr());
  const monday = new Date(mondayStr+'T00:00:00');
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const count = sessionsInRange(sessions, monday.toISOString().slice(0,10), sunday.toISOString().slice(0,10)).length;
  return {count:count, target:targetPerWeek, pct: Math.min(100, Math.round(count/targetPerWeek*100))};
}
function heatmapData(sessions, weeksBack){
  const today = new Date(todayStr()+'T00:00:00');
  const start = new Date(today); start.setDate(start.getDate() - weeksBack*7);
  const counts = {};
  sessions.forEach(s=>{ counts[s.date] = (counts[s.date]||0)+1; });
  const days = [];
  const cursor = new Date(start);
  const startDow = (cursor.getDay()+6)%7;
  cursor.setDate(cursor.getDate()-startDow);
  while(cursor <= today){
    const ds = cursor.toISOString().slice(0,10);
    days.push({date:ds, count:counts[ds]||0});
    cursor.setDate(cursor.getDate()+1);
  }
  return days;
}
function muscleGroupVolumes(plans, sessions, daysBack){
  const cutoff = new Date(todayStr()+'T00:00:00'); cutoff.setDate(cutoff.getDate()-daysBack);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  const codeToGroup = {};
  WORKOUT_ORDER.forEach(wk=>plans[wk].exercises.forEach(ex=>{ codeToGroup[ex.code]=ex.muscleGroup||'Inne'; }));
  const totals = {};
  sessions.filter(s=>s.date>=cutoffStr).forEach(s=>{
    s.entries.forEach(e=>{
      const g = codeToGroup[e.code] || 'Inne';
      const sets = (e.reps||[]).length;
      totals[g] = (totals[g]||0) + sets;
    });
  });
  return Object.keys(totals).map(g=>({group:g, sets:totals[g]})).sort((a,b)=>b.sets-a.sets);
}

// ---------- generic SVG line chart (weight / 1RM / volume / measurements) ----------
function renderChart(data, w, h, opts){
  opts = opts || {};
  if(data.length < 2) return '<div style="padding:28px 12px; text-align:center; font-size:13px; color:var(--text-faint);">Za mało danych na wykres</div>';
  const values = data.map(d=>d.value);
  const minV = Math.min.apply(null, values), maxV = Math.max.apply(null, values);
  const pad = (maxV-minV)*0.2 || Math.max(1, minV*0.1);
  const yMin = minV-pad, yMax = maxV+pad;
  const P = {top:16, right:14, bottom:22, left:8};
  const cw = w-P.left-P.right, ch = h-P.top-P.bottom;
  const pts = data.map((d,i)=>{
    const x = P.left + (data.length===1?0:(i/(data.length-1))*cw);
    const y = P.top + (1-(d.value-yMin)/(yMax-yMin))*ch;
    return {x:x,y:y,date:d.date,value:d.value};
  });
  const pathD = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaD = pathD+' L'+pts[pts.length-1].x.toFixed(1)+','+(h-P.bottom)+' L'+pts[0].x.toFixed(1)+','+(h-P.bottom)+' Z';
  const gid = 'g'+Math.random().toString(36).slice(2,8);
  const grad = '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent2)" stop-opacity="0.35"/><stop offset="100%" stop-color="var(--accent2)" stop-opacity="0"/></linearGradient></defs>';
  const area = '<path d="'+areaD+'" fill="url(#'+gid+')" stroke="none"/>';
  const circles = pts.map(p=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" style="fill:var(--accent2)"/>').join('');
  const gridY = [0,0.5,1].map(f=>P.top+f*ch);
  const grid = gridY.map(y=>'<line x1="'+P.left+'" y1="'+y.toFixed(1)+'" x2="'+(w-P.right)+'" y2="'+y.toFixed(1)+'" style="stroke:var(--border)" stroke-dasharray="3 3"/>').join('');
  const step = Math.max(1, Math.ceil(pts.length/4));
  let labels = '';
  pts.forEach((p,i)=>{
    if(i===0 || i===pts.length-1 || i%step===0){
      labels += '<text x="'+p.x.toFixed(1)+'" y="'+(h-6)+'" font-size="10" text-anchor="middle" style="fill:var(--text-faint)">'+esc(formatDatePL(p.date))+'</text>';
    }
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'+grad+grid+area+'<path d="'+pathD+'" fill="none" style="stroke:var(--accent2)" stroke-width="2.5"/>'+circles+labels+'</svg>';
}

// ---------- heatmap (GitHub style) ----------
function renderHeatmap(days){
  const weeks = [];
  for(let i=0;i<days.length;i+=7) weeks.push(days.slice(i,i+7));
  const cell = 12, gap = 3;
  const w = weeks.length*(cell+gap), h = 7*(cell+gap);
  let rects = '';
  weeks.forEach((week,wi)=>{
    week.forEach((day,di)=>{
      const x = wi*(cell+gap), y = di*(cell+gap);
      let fill = 'var(--surface-hi)';
      if(day.count===1) fill = 'rgba(168,85,247,0.45)';
      else if(day.count>=2) fill = 'var(--accent)';
      rects += '<rect x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+'" rx="3" fill="'+fill+'"><title>'+day.date+'</title></rect>';
    });
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+(h*1.15)+'" preserveAspectRatio="xMidYMid meet">'+rects+'</svg>';
}

// ---------- month calendar grid ----------
function buildMonthGrid(year, month){ // month: 0-11
  const first = new Date(year, month, 1);
  const startDow = (first.getDay()+6)%7; // Mon=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++){
    const ds = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    cells.push(ds);
  }
  while(cells.length%7!==0) cells.push(null);
  return cells;
}
function dayStatus(dateStr, sessions, planned){
  const sess = sessions.filter(s=>s.date===dateStr);
  if(sess.length) return {status:'done', workouts: sess.map(s=>s.workout)};
  const plan = planned.find(p=>p.date===dateStr);
  if(plan){
    if(plan.workout==='rest') return {status:'rest', workouts:[]};
    if(dateStr < todayStr()) return {status:'skipped', workouts:[plan.workout]};
    return {status:'planned', workouts:[plan.workout]};
  }
  return {status:'empty', workouts:[]};
}

    html += '<div style="position:relative;"><input type="number" inputmode="numeric" min="0" data-role="rep" data-idx="'+i+'" value="'+esc(r)+'" style="width:40px; height:40px; text-align:center; border-radius:10px; background:var(--surface-hi); border:1px solid var(--border); font-size:14px;"></div>';
  });
  html += '<button data-action="add-set" style="width:32px; height:40px; border-radius:10px; background:var(--surface-hi); color:var(--text-muted); display:flex; align-items:center; justify-content:center;">'+icon('plus',14)+'</button>';

  html += '<button data-action="start-rest-timer" title="Rozpocznij odpoczynek" style="width:36px; height:40px; border-radius:10px; background:rgba(168,85,247,0.15); color:var(--accent); display:flex; align-items:center; justify-content:center;">'+icon('timer',16)+'</button>';

    if(S.logSaved.prs.length){
      html += '<div class="card pop" style="border-color:var(--pr); padding:16px; margin-top:18px; text-align:left;">';
      html += '<div style="display:flex; align-items:center; justify-content:center; gap:8px; color:var(--pr); margin-bottom:8px;">'+icon('award',18)+'<span style="font-weight:800; font-size:14px;">NOWY REKORD</span></div>';

  }

  const exercises = S.plans[S.logKey].exercises;

  html += '<h2 style="font-size:20px; font-weight:800; margin:0;">'+esc(S.plans[S.logKey].label)+'</h2></div>';
  html += '<button data-action="change-workout" style="font-size:12px; font-weight:700; color:var(--text-muted); padding:6px;">Zmień</button></div>';

  html += '<div style="display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:14px;">';
  html += '<span style="color:var(--text-muted); display:flex;">'+icon('calendar',16)+'</span>';
  html += '<input type="date" id="log-date-input" value="'+esc(S.form.date)+'" style="background:transparent; border:none; flex:1; font-size:14px; outline:none; color-scheme:dark;"></div>';

  exercises.forEach(ex=>{
    const d = S.form.entries[ex.code];
    if(!d) return;
    const last = lastEntryForExercise(S.sessions, ex.code);
    const suggestion = suggestNextWeight(S.sessions, ex);
    const cmp = compareToLast(S.sessions, ex.code, d.weight, d.reps);
    html += '<div class="card" style="padding:14px; margin-bottom:10px;" data-code="'+ex.code+'">';
    html += '<div style="margin-bottom:10px;"><div style="font-size:14px; font-weight:700;">'+esc(ex.name)+'</div>';
    html += '<div style="font-size:12px; color:var(--text-faint); margin-top:2px;">'+(ex.target?'cel: '+esc(ex.target):'bez celu')+(last?' · ostatnio '+fmtWeight(last.weight)+' kg × '+fmtReps(last.reps):'')+'</div>';
    if(ex.note) html += '<div style="font-size:11px; color:var(--accent2); margin-top:3px;">💡 '+esc(ex.note)+'</div>';
    if(suggestion && !last) {} else if(suggestion){
      html += '<div style="font-size:11px; color:var(--text-muted); margin-top:3px;">Sugerowany ciężar: <b style="color:var(--accent2);">'+fmtWeight(suggestion.weight)+' kg</b></div>';
    }
    html += '</div>';
    html += '<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">';
    html += '<input type="number" inputmode="decimal" step="0.5" placeholder="kg" data-role="weight" value="'+esc(d.weight)+'" style="width:64px; height:40px; text-align:center; border-radius:10px; background:var(--surface-hi); border:1px solid var(--border); font-weight:700; font-size:14px;">';
    html += repInputsHtml(d.reps);
    html += '</div>';
    if(cmp && (cmp.weightDiff!==0 || cmp.repsDiff!==0)){
      const wUp = cmp.weightDiff>0, rUp = cmp.repsDiff>0;
      html += '<div style="font-size:11px; margin-top:8px; color:var(--text-muted);">vs ostatnio: ';
      html += '<span style="color:'+(cmp.weightDiff===0?'var(--text-faint)':wUp?'var(--green)':'var(--pr)')+'; font-weight:700;">'+(cmp.weightDiff>0?'+':'')+fmt1(cmp.weightDiff)+' kg</span>, ';
      html += '<span style="color:'+(cmp.repsDiff===0?'var(--text-faint)':rUp?'var(--green)':'var(--pr)')+'; font-weight:700;">'+(cmp.repsDiff>0?'+':'')+cmp.repsDiff+' powt.</span></div>';

    if(d.showNote || d.info){
      html += '<input type="text" data-role="info" value="'+esc(d.info||'')+'" placeholder="Notatka do tej serii..." style="width:100%; height:36px; margin-top:6px; padding:0 10px; border-radius:10px; background:var(--surface-hi); border:1px solid var(--border); font-size:12px;">';
    }
    html += '</div>';
  });

  Object.keys(S.form.entries).forEach(code=>{
    const d = S.form.entries[code];
    if(!d.custom) return;
    html += '<div class="card" style="border-style:dashed; padding:14px; margin-bottom:10px;" data-code="'+code+'">';
    html += '<div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">';
    html += '<input type="text" placeholder="Nazwa ćwiczenia" data-role="custom-name" value="'+esc(d.name)+'" style="flex:1; height:36px; padding:0 10px; border-radius:10px; background:var(--surface-hi); border:1px solid var(--border); font-size:14px;">';
    html += '<button data-action="remove-custom" style="color:var(--text-faint); display:flex;">'+icon('x',18)+'</button></div>';
    html += '<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">';
    html += '<input type="number" inputmode="decimal" step="0.5" placeholder="kg" data-role="weight" value="'+esc(d.weight)+'" style="width:64px; height:40px; text-align:center; border-radius:10px; background:var(--surface-hi); border:1px solid var(--border); font-weight:700; font-size:14px;">';
    html += repInputsHtml(d.reps);
    html += '</div></div>';
  });

  html += '<button data-action="add-custom-exercise" style="width:100%; border:1px dashed var(--border); color:var(--text-muted); border-radius:12px; padding:11px; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:16px;">'+icon('plus',14)+' Dodaj ćwiczenie</button>';
  html += '<button data-action="save-session" class="grad-btn" style="width:100%; padding:15px;">ZAPISZ TRENING</button>';
  html += '</div>';
  html += timerWidgetHtml();
  return html;
}

function viewPostepy(){
  const flat = flatExercisesWithHistory(S.plans, S.sessions);
  if(!S.progressCode || !flat.find(f=>f.code===S.progressCode)) S.progressCode = flat[0]?flat[0].code:null;

  let html = '<div class="anim" style="padding-top:4px; padding-bottom:16px;">';
  html += '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">';
  html += '<h2 style="font-size:20px; font-weight:800; margin:0;">Postępy</h2>';
  html += '<div style="display:flex; background:var(--surface-hi); border-radius:10px; padding:3px;">';
  ['charts','records'].forEach(m=>{
    const active = S.progressMode===m;
    html += '<button data-action="progress-mode" data-mode="'+m+'" style="padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700; '+(active?'background:var(--grad); color:#0F0B1A;':'color:var(--text-muted);')+'">'+(m==='charts'?'Wykresy':'Rekordy')+'</button>';
  });
  html += '</div></div>';

  if(S.progressMode==='records'){
    const recs = flat.map(e=>({e:e, pr:prForExercise(S.sessions, e.code)})).filter(x=>x.pr).sort((a,b)=>b.pr.weight-a.pr.weight);
    if(!recs.length){
      html += '<div style="padding-top:40px; text-align:center; font-size:13px; color:var(--text-faint);">Brak jeszcze żadnych rekordów.</div>';
    } else {
      recs.forEach(r=>{
        html += '<div class="card" style="padding:14px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;">';
        html += '<div><div style="font-size:13px; font-weight:700;">'+esc(r.e.name)+'</div><div style="font-size:11px; color:var(--text-faint);">'+esc(formatDatePL(r.pr.date,{year:true}))+'</div></div>';
        html += '<div style="display:flex; align-items:center; gap:8px;"><span class="num grad-text" style="font-size:18px;">'+fmtWeight(r.pr.weight)+' kg</span><span style="color:var(--pr); display:flex;">'+icon('award',18)+'</span></div></div>';
      });
    }
    const mgv = muscleGroupVolumes(S.plans, S.sessions, 30);
    if(mgv.length){
      html += '<div class="hcap" style="margin:18px 0 8px;">Serie wg grupy mięśniowej (30 dni)</div>';
      const maxSets = Math.max.apply(null, mgv.map(x=>x.sets));
      mgv.forEach(x=>{
        html += '<div style="margin-bottom:8px;"><div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;"><span style="color:var(--text-muted);">'+esc(x.group)+'</span><span class="num">'+x.sets+'</span></div>';
        html += '<div style="height:6px; border-radius:3px; background:var(--surface-hi); overflow:hidden;"><div style="height:100%; width:'+(x.sets/maxSets*100)+'%; background:var(--grad); border-radius:3px;"></div></div></div>';
      });
    }
    html += '</div>';
    return html;
  }

  // charts mode
  html += '<div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;">';
  flat.forEach(e=>{
    const active = e.code===S.progressCode;
    const tr = computeTrend(S.sessions, e.code);
    html += '<button data-action="select-progress" data-code="'+e.code+'" style="flex-shrink:0; white-space:nowrap; padding:8px 12px; border-radius:999px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:5px; '+
      (active? 'background:'+WCOLOR[e.workout]+'; color:#0F0B1A;' : 'background:var(--surface); color:var(--text-muted); border:1px solid var(--border);')+'">'+
      (tr.hasData?trendEmoji(tr.state):'')+' '+esc(e.name)+'</button>';
  });
  html += '</div>';

  if(!S.progressCode){ html += '</div>'; return html; }

  const trend = computeTrend(S.sessions, S.progressCode);
  const hist = historyForExercise(S.sessions, S.progressCode);
  const pr = hist.length ? hist.reduce((b,c)=>c.weight>b.weight?c:b, hist[0]) : null;

  if(trend.hasData){
    html += '<button data-action="toggle-trend-explain" class="card" style="width:100%; text-align:left; padding:14px; margin-bottom:14px; display:flex; align-items:center; gap:12px;">';
    html += '<span style="color:'+trendColorVar(trend.state)+'; display:flex; flex-shrink:0;">'+trendIcon(trend.state,22)+'</span>';
    html += '<div style="flex:1;"><div style="font-size:13px; font-weight:800; color:'+trendColorVar(trend.state)+';">'+(trend.state==='up'?'Progres':trend.state==='down'?'Regres':'Stabilnie')+'</div>';
    if(S.showTrendExplain) html += '<div style="font-size:12px; color:var(--text-muted); margin-top:3px;">'+esc(trend.reason)+'</div>';
    html += '</div><span style="color:var(--text-faint); display:flex;">'+icon(S.showTrendExplain?'chevUp':'chevDown',16)+'</span></button>';
  }

  if(pr){
    html += '<div class="card" style="display:flex; align-items:center; justify-content:space-between; padding:16px; margin-bottom:14px;">';
    html += '<div><div class="hcap">Rekord</div><div class="num grad-text" style="font-size:26px;">'+fmtWeight(pr.weight)+' kg</div>';
    html += '<div style="font-size:12px; color:var(--text-muted);">'+esc(formatDatePL(pr.date,{year:true}))+'</div></div>';
    html += '<span style="color:var(--pr); display:flex;">'+icon('award',28)+'</span></div>';
  }

  html += '<div style="display:flex; background:var(--surface-hi); border-radius:10px; padding:3px; margin-bottom:10px; width:fit-content;">';
  [['weight','Ciężar'],['1rm','1RM'],['volume','Objętość']].forEach(pair=>{
    const active = (S.chartMetric||'weight')===pair[0];
    html += '<button data-action="chart-metric" data-metric="'+pair[0]+'" style="padding:6px 12px; border-radius:8px; font-size:11px; font-weight:700; '+(active?'background:var(--grad); color:#0F0B1A;':'color:var(--text-muted);')+'">'+pair[1]+'</button>';
  });
  html += '</div>';

  const metric = S.chartMetric||'weight';
  const chartData = hist.map(h=>({date:h.date, value: metric==='1rm'?entryBest1RM(h) : metric==='volume'?entryVolume(h) : h.weight}));
  html += '<div class="card" style="padding:6px 4px 4px; margin-bottom:14px;">'+renderChart(chartData, 320, 190)+'</div>';

  if(hist.length){
    html += '<div class="hcap" style="margin-bottom:8px;">Historia</div>';
    hist.slice().reverse().forEach(h=>{
      html += '<div style="display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:8px;">';
      html += '<span style="font-size:14px; color:var(--text-muted);">'+esc(formatDatePL(h.date,{year:true}))+'</span>';
      html += '<span class="num" style="font-size:14px;">'+fmtWeight(h.weight)+' kg · '+fmtReps(h.reps)+'</span></div>';
    });
  }
  html += '</div>';
  return html;
}

function viewPomiary(){
  const params = S.measureParams;
  if(!S.measureParamKey || !params.find(p=>p.key===S.measureParamKey)) S.measureParamKey = params[0]?params[0].key:null;
  const param = params.find(p=>p.key===S.measureParamKey);

  let html = '<div class="anim" style="padding-top:4px; padding-bottom:16px;">';
  html += '<h2 style="font-size:20px; font-weight:800; margin:0 0 14px;">Pomiary</h2>';

  html += '<button data-action="open-add-measurement" class="grad-btn" style="width:100%; padding:14px; margin-bottom:14px; display:flex; align-items:center; justify-content:center; gap:8px;">'+icon('plus',18)+' NOWY POMIAR</button>';

  if(S.showMeasureForm) html += measureFormHtml();

  html += '<div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;">';
  params.forEach(p=>{
    const active = p.key===S.measureParamKey;
    html += '<button data-action="select-measure-param" data-key="'+p.key+'" style="flex-shrink:0; white-space:nowrap; padding:8px 12px; border-radius:999px; font-size:12px; font-weight:600; '+
      (active? 'background:var(--grad); color:#0F0B1A;' : 'background:var(--surface); color:var(--text-muted); border:1px solid var(--border);')+'">'+esc(p.label)+'</button>';
  });
  html += '</div>';

  if(!param){ html += '</div>'; return html; }

  const points = S.measurements.map(m=>({date:m.date, value:m.values[param.key]})).filter(p=>p.value!=null).sort((a,b)=>a.date.localeCompare(b.date));
  const rangeDays = S.measureRange||90;
  const cutoff = new Date(todayStr()+'T00:00:00'); cutoff.setDate(cutoff.getDate()-rangeDays);
  const cutoffStr = rangeDays>=99999 ? '0000-00-00' : cutoff.toISOString().slice(0,10);
  const filtered = points.filter(p=>p.date>=cutoffStr);

  html += '<div style="display:flex; gap:6px; margin-bottom:14px;">';
  [[30,'30d'],[90,'90d'],[365,'1r'],[99999,'Wszystko']].forEach(pair=>{
    const active = rangeDays===pair[0];
    html += '<button data-action="measure-range" data-range="'+pair[0]+'" style="padding:6px 12px; border-radius:999px; font-size:11px; font-weight:700; '+(active?'background:var(--surface-hi2); color:var(--text);':'color:var(--text-faint);')+' border:1px solid var(--border);">'+pair[1]+'</button>';
  });
  html += '</div>';

  if(points.length){
    const cur = points[points.length-1];
    const prev = points.length>1 ? points[points.length-2] : null;
    html += '<div class="card" style="padding:16px; margin-bottom:14px;">';
    html += '<div class="hcap">Aktualnie</div>';
    html += '<div class="num grad-text" style="font-size:28px;">'+fmt1(cur.value)+' '+param.unit+'</div>';
    if(prev){
      const d = cur.value-prev.value;
      const pct = prev.value ? (d/prev.value*100) : 0;
      html += '<div style="font-size:12px; margin-top:4px; color:'+(d===0?'var(--text-faint)':d<0?'var(--green)':'var(--pr)')+';">'+(d>0?'+':'')+fmt1(d)+' '+param.unit+' ('+(pct>0?'+':'')+fmt1(pct)+'%) vs poprzedni pomiar</div>';
    }
    html += '</div>';
  }

  html += '<div class="card" style="padding:6px 4px 4px; margin-bottom:14px;">'+renderChart(filtered, 320, 190)+'</div>';

  if(points.length){
    html += '<div class="hcap" style="margin-bottom:8px;">Historia</div>';
    points.slice().reverse().forEach(p=>{
      html += '<div style="display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:8px;">';
      html += '<span style="font-size:14px; color:var(--text-muted);">'+esc(formatDatePL(p.date,{year:true}))+'</span>';
      html += '<span class="num" style="font-size:14px;">'+fmt1(p.value)+' '+param.unit+'</span></div>';
    });
  }
  html += '</div>';
  return html;
}

}

// ---------- log form ----------
function initLogForm(wk){
  const exercises = S.plans[wk].exercises;
  const entries = {};
  exercises.forEach(ex=>{
    const last = lastEntryForExercise(S.sessions, ex.code);
    const setCount = last ? last.reps.length : parseTargetSets(ex.target);
    entries[ex.code] = { name: ex.name, weight: last?String(last.weight):'', reps: last?last.reps.map(String):Array(setCount).fill(''), info:'', showNote:false, custom:false };
  });
  S.logKey = wk;
  S.form = { date: todayStr(), entries: entries };
  S.logSaved = null;
}
function syncLogFormFromDOM(){
  if(!S.logKey || !S.form.entries) return;
  const dateInput = document.getElementById('log-date-input');
  if(dateInput) S.form.date = dateInput.value;
  document.querySelectorAll('[data-code]').forEach(function(block){
    const code = block.getAttribute('data-code');
    const entry = S.form.entries[code];
    if(!entry) return;
    const weightInput = block.querySelector('[data-role="weight"]');
    if(weightInput) entry.weight = weightInput.value;
    const nameInput = block.querySelector('[data-role="custom-name"]');
    if(nameInput) entry.name = nameInput.value;
    const infoInput = block.querySelector('[data-role="info"]');
    if(infoInput) entry.info = infoInput.value;
    const repInputs = block.querySelectorAll('[data-role="rep"]');
    if(repInputs.length){ const reps=[]; repInputs.forEach(function(ri){reps.push(ri.value);}); entry.reps = reps; }
  });
}
function syncSettingsFromDOM(){
  if(!S.settingsDraft) return;
  WORKOUT_ORDER.forEach(function(wk){
    const labelInput = document.querySelector('[data-role="wk-label"][data-wk="'+wk+'"]');
    if(labelInput) S.settingsDraft[wk].label = labelInput.value;
    S.settingsDraft[wk].exercises.forEach(function(ex, idx){
      const nameInput = document.querySelector('[data-role="ex-name"][data-wk="'+wk+'"][data-idx="'+idx+'"]');
      const targetInput = document.querySelector('[data-role="ex-target"][data-wk="'+wk+'"][data-idx="'+idx+'"]');
      const muscleInput = document.querySelector('[data-role="ex-muscle"][data-wk="'+wk+'"][data-idx="'+idx+'"]');
      const noteInput = document.querySelector('[data-role="ex-note"][data-wk="'+wk+'"][data-idx="'+idx+'"]');
      if(nameInput) ex.name = nameInput.value;
      if(targetInput) ex.target = targetInput.value;
      if(muscleInput) ex.muscleGroup = muscleInput.value;
      if(noteInput) ex.note = noteInput.value;
    });
  });
}
function syncMeasureParamsFromDOM(){
  if(!S.measureParamsDraft) return;
  S.measureParamsDraft.forEach(function(p, idx){
    const labelInput = document.querySelector('[data-role="mp-label"][data-idx="'+idx+'"]');
    const unitInput = document.querySelector('[data-role="mp-unit"][data-idx="'+idx+'"]');

function syncMeasureFormFromDOM(){

  const dateInput = document.getElementById('measure-date-input');
  if(dateInput) S.measureForm.date = dateInput.value;
  document.querySelectorAll('[data-role="measure-val"]').forEach(function(inp){
    S.measureForm.values[inp.getAttribute('data-key')] = inp.value;

function doSaveSession(){
  const entries = [];
  const newCustomDefs = [];
  Object.keys(S.form.entries).forEach(function(code){
    const d = S.form.entries[code];
    if(d.weight==='' || d.weight===null || d.weight===undefined) return;
    if(d.custom && !d.name.trim()) return;
    const name = d.custom ? d.name.trim() : d.name;
    entries.push({ code:code, name:name, weight:parseFloat(d.weight), reps:d.reps.map(function(r){return r===''?0:parseInt(r,10);}), info: d.info?d.info.trim():null });
    if(d.custom) newCustomDefs.push({code:code, name:name, target:null, muscleGroup:'', note:null});
  });
  if(!entries.length){ alert('Wpisz przynajmniej jeden ciężar, żeby zapisać trening.'); return; }
  const prNames = entries.filter(function(e){
    const prev = prForExercise(S.sessions, e.code);
    return (prev && e.weight>prev.weight) || (!prev && e.weight>0);
  }).map(function(e){return e.name;});
  if(newCustomDefs.length){
    S.plans[S.logKey].exercises = S.plans[S.logKey].exercises.concat(newCustomDefs);
    savePlans(S.plans);
  }
  const session = {id:genId(), date:S.form.date, workout:S.logKey, entries:entries};
  S.sessions.push(session);
  saveSessions(S.sessions);
  S.logSaved = {count:entries.length, prs:prNames};
  if(prNames.length) setTimeout(confettiBurst, 200);
}
function doSaveSettings(){
  const cleaned = {};
  WORKOUT_ORDER.forEach(function(wk){
    const label = (S.settingsDraft[wk].label||'').trim() || S.plans[wk].label;
    const exercises = S.settingsDraft[wk].exercises
      .map(function(ex){ return {code:ex.code, name:(ex.name||'').trim(), target: ex.target && ex.target.trim() ? ex.target.trim() : null, muscleGroup:(ex.muscleGroup||'').trim(), note:(ex.note||'').trim()||null}; })
      .filter(function(ex){ return ex.name; });
    cleaned[wk] = {label:label, exercises:exercises};
  });
  S.plans = cleaned;
  savePlans(S.plans);
  S.showSettings = false;
}
function doExport(){
  const data = {plans:S.plans, sessions:S.sessions, measureParams:S.measureParams, measurements:S.measurements, planned:S.planned, meta:S.meta, exportedAt:new Date().toISOString(), app:'PROGRES'};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'progres-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);}, 1000);
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.12;
    o.start();
    setTimeout(function(){ o.stop(); ctx.close(); }, 350);
  }catch(e){}
}
function runTimerTick(){
  if(window.__timerInterval) clearInterval(window.__timerInterval);
  window.__timerInterval = setInterval(function(){
    if(!S.timer || S.timer.paused) return;
    const remaining = Math.max(0, Math.round((S.timer.endAt - Date.now())/1000));
    S.timer.remaining = remaining;
    const el = document.getElementById('timer-remaining');
    if(el) el.textContent = formatTimerTime(remaining);
    if(remaining<=0){
      clearInterval(window.__timerInterval);
      try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
      playBeep();
      S.timer = null;
      render();
    }
  }, 250);
}

// ---------- render ----------
function render(){
  let html = viewHeader();
  html += '<main style="flex:1; overflow-y:auto; padding:0 16px 96px;">';
  if(S.showSettings){ html += viewSettings(); }
  else if(S.tab==='kalendarz'){ html += viewKalendarz(); }
  else if(S.tab==='log'){ html += viewLog(); }
  else if(S.tab==='progress'){ html += viewPostepy(); }
  else if(S.tab==='pomiary'){ html += viewPomiary(); }
  else if(S.tab==='history'){ html += viewHistoria(); }
  html += '</main>';
  html += viewTabBar();
  document.getElementById('app').innerHTML = html;
}

// ---------- action dispatcher ----------
function handleAction(action, ds, code){
  switch(action){
    case 'set-tab':
      S.showSettings = false;
      if(ds.tab==='log'){ S.logKey=null; S.form={}; S.logSaved=null; }
      S.tab = ds.tab;
      break;
    case 'go-log':
      S.showSettings = false; S.tab = 'log';
      if(ds.workout) initLogForm(ds.workout); else { S.logKey=null; S.form={}; S.logSaved=null; }
      break;
    case 'go-log-date':
      S.showSettings = false; S.tab = 'log';
      initLogForm(ds.workout);
      S.form.date = ds.date;
      break;
    case 'select-workout': initLogForm(ds.workout); break;
    case 'change-workout': S.logKey=null; S.form={}; S.logSaved=null; break;
    case 'add-set': syncLogFormFromDOM(); if(code && S.form.entries[code]) S.form.entries[code].reps.push(''); break;
    case 'remove-set': syncLogFormFromDOM(); if(code && S.form.entries[code] && S.form.entries[code].reps.length>1) S.form.entries[code].reps.pop(); break;
    case 'start-rest-timer':
      S.timerDuration = S.timerDuration||90;
      S.timer = {duration:S.timerDuration, endAt:Date.now()+S.timerDuration*1000, paused:false, remaining:S.timerDuration};
      render(); runTimerTick(); return;
    case 'timer-toggle-pause':
      if(S.timer){
        if(S.timer.paused){ S.timer.endAt = Date.now()+S.timer.remaining*1000; S.timer.paused=false; render(); runTimerTick(); return; }
        else { S.timer.paused=true; }
      }
      break;
    case 'timer-stop':
      S.timer=null; if(window.__timerInterval) clearInterval(window.__timerInterval);
      break;
    case 'toggle-note':
      syncLogFormFromDOM();
      if(code && S.form.entries[code]) S.form.entries[code].showNote = !S.form.entries[code].showNote;
      break;
    case 'add-custom-exercise':
      syncLogFormFromDOM();
      S.form.entries[S.logKey+'_custom_'+genId()] = {name:'', weight:'', reps:['','',''], info:'', showNote:false, custom:true};
      break;
    case 'remove-custom': syncLogFormFromDOM(); if(code) delete S.form.entries[code]; break;
    case 'save-session': syncLogFormFromDOM(); doSaveSession(); break;
    case 'close-log-success': S.logKey=null; S.form={}; S.logSaved=null; break;
    case 'toggle-session': S.openSessionId = (S.openSessionId===ds.id)?null:ds.id; break;
    case 'confirm-delete-session': S.confirmDeleteId = ds.id; break;
    case 'cancel-delete-session': S.confirmDeleteId = null; break;
    case 'delete-session': S.sessions = S.sessions.filter(function(s){return s.id!==ds.id;}); saveSessions(S.sessions); S.confirmDeleteId=null; break;

    case 'cal-prev-month': S.calMonth--; if(S.calMonth<0){S.calMonth=11; S.calYear--;} break;
    case 'cal-next-month': S.calMonth++; if(S.calMonth>11){S.calMonth=0; S.calYear++;} break;
    case 'cal-select-day': S.calSelectedDate = (S.calSelectedDate===ds.date)?null:ds.date; break;
    case 'plan-day':
      S.planned.push({id:genId(), date:ds.date, workout:ds.workout, note:''});
      savePlanned(S.planned);
      break;
    case 'delete-planned':
      S.planned = S.planned.filter(function(p){return p.id!==ds.id;});
      savePlanned(S.planned);
      break;

    case 'progress-mode': S.progressMode = ds.mode; break;
    case 'select-progress': S.progressCode = ds.code; S.showTrendExplain=false; break;
    case 'toggle-trend-explain': S.showTrendExplain = !S.showTrendExplain; break;
    case 'chart-metric': S.chartMetric = ds.metric; break;

    case 'select-measure-param': S.measureParamKey = ds.key; break;
    case 'measure-range': S.measureRange = parseInt(ds.range,10); break;
    case 'open-add-measurement': S.showMeasureForm = true; S.measureForm = {date:todayStr(), values:{}}; break;
    case 'close-add-measurement': S.showMeasureForm = false; break;
    case 'save-measurement':
      syncMeasureFormFromDOM();
      { const vals = {}; let any=false;
        Object.keys(S.measureForm.values).forEach(function(k){ const v=S.measureForm.values[k]; if(v!==''&&v!=null){ vals[k]=parseFloat(v); any=true; } });
        if(!any){ alert('Wpisz przynajmniej jedną wartość.'); return; }
        S.measurements.push({id:genId(), date:S.measureForm.date, values:vals});
        saveMeasurements(S.measurements);
        S.showMeasureForm = false;
      }
      break;

    case 'open-settings':
      S.settingsDraft = JSON.parse(JSON.stringify(S.plans));
      S.measureParamsDraft = JSON.parse(JSON.stringify(S.measureParams));
      S.showSettings = true;
      break;
    case 'close-settings': S.showSettings = false; break;
    case 'add-ex': syncSettingsFromDOM(); S.settingsDraft[ds.wk].exercises.push({code:ds.wk+'_new_'+genId(), name:'', target:'', muscleGroup:'', note:''}); break;
    case 'remove-ex': syncSettingsFromDOM(); S.settingsDraft[ds.wk].exercises.splice(parseInt(ds.idx,10),1); break;
    case 'save-settings': syncSettingsFromDOM(); doSaveSettings(); break;
    case 'add-measure-param': syncMeasureParamsFromDOM(); S.measureParamsDraft.push({key:'custom_'+genId(), label:'', unit:'cm'}); break;
    case 'remove-measure-param': syncMeasureParamsFromDOM(); S.measureParamsDraft.splice(parseInt(ds.idx,10),1); break;
    case 'save-measure-params':
      syncMeasureParamsFromDOM();
      { const cleaned = S.measureParamsDraft.map(function(p){ return {key:p.key, label:(p.label||'').trim(), unit:(p.unit||'').trim()||'cm'}; }).filter(function(p){return p.label;});
        S.measureParams = cleaned.length ? cleaned : S.measureParams;
        saveMeasureParams(S.measureParams);
      }
      break;
    case 'save-weekly-goal':
      { const inp = document.getElementById('weekly-goal-input');
        const val = inp ? parseInt(inp.value,10) : 3;
        S.meta.weeklyGoal = (val>=1 && val<=14) ? val : 3;
        saveMeta(S.meta);
      }
      break;

    case 'export-data': doExport(); return;
    case 'trigger-import': document.getElementById('import-file-input').click(); return;
    case 'dismiss-tip': S.showTip=false; S.meta.tipDismissed=true; saveMeta(S.meta); break;
    default: return;
  }
  render();
}

// ---------- init ----------
var today0 = new Date();
var S = Object.assign({
  tab:'kalendarz', logKey:null, form:{}, logSaved:null, showSettings:false, settingsDraft:null,
  confirmDeleteId:null, openSessionId:null, progressCode:null, progressMode:'charts', showTrendExplain:false, chartMetric:'weight',
  calYear:today0.getFullYear(), calMonth:today0.getMonth(), calSelectedDate:null,
  measureParamKey:null, measureRange:90, showMeasureForm:false, measureForm:null, measureParamsDraft:null,
  timer:null, timerDuration:90
}, loadAll());
S.showTip = !(S.meta && S.meta.tipDismissed);

document.getElementById('app').addEventListener('click', function(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const codeBlock = btn.closest('[data-code]');
  const codeVal = codeBlock ? codeBlock.getAttribute('data-code') : (btn.dataset.code||null);
  handleAction(action, btn.dataset, codeVal);
});

document.getElementById('import-file-input').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = JSON.parse(ev.target.result);
      if(data.plans && data.sessions){
        S.plans = data.plans; S.sessions = data.sessions;
        if(data.measureParams) S.measureParams = data.measureParams;
        if(data.measurements) S.measurements = data.measurements;
        if(data.planned) S.planned = data.planned;
        savePlans(S.plans); saveSessions(S.sessions);
        saveMeasureParams(S.measureParams); saveMeasurements(S.measurements); savePlanned(S.planned);
        render();
        alert('Dane zaimportowane pomyślnie.');
      } else { alert('Nieprawidłowy format pliku.'); }
    }catch(err){ alert('Błąd podczas importu: '+err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

render();
</script>
